function pose(m, o) {

  if (o.walk != null) { aL.rotation.x = Math.sin(o.walk) * 0.6; aR.rotation.x = -Math.sin(o.walk) * 0.6; }
  if (o.akimbo) { aL.rotation.z = -0.7; aR.rotation.z = 0.7; }

// 階段⇄エスカレーターの手すり乗り越えモーション
function climbPose(p) {
  const m = p.mesh, u = m.userData, [aL, aR] = u.arms, k = clamp(p.st / p.vt, 0, 1);
  m.rotation.y = p.climbDir < 0 ? Math.PI / 2 : -Math.PI / 2;
  if (k < 0.25) {
    const q = k / 0.25;
    aL.rotation.x = aR.rotation.x = 2.4 * q;
    m.rotation.x = -0.2 * q;
  } else if (k < 0.7) {
    const q = (k - 0.25) / 0.45;
    aL.rotation.x = aR.rotation.x = lerp(2.4, 0.4, q);
    aL.rotation.z = -0.5 * q; aR.rotation.z = 0.5 * q;
    u.legP.rotation.x = Math.sin(Math.PI * q) * 1.6;
    m.rotation.x = -0.35;
    m.rotation.z = Math.sin(Math.PI * q) * 0.3;
  } else {
    const q = (k - 0.7) / 0.3;
    aL.rotation.z = -0.9 * (1 - q); aR.rotation.z = 0.9 * (1 - q);
    m.scale.y = 1 - Math.sin(Math.PI * q) * 0.15;
  }
}
function footY(lane, ys) {
  if (lane === 'S') return clamp(Math.floor(ys), 0, CFG.STEPS) * R;
  const off = S.esc % 1;

}

function addStander(y) {

// ===== 敵（仁王立ち／登ってくる人） =====
function addFoe(kind, y, type) {
  type = type || weighted(kind === 'blocker' ? NORMAL_BLOCKERS : WALKER_TYPES);
  const f = {
    kind, type, dir: kind === 'blocker' ? 1 : -1, y, x: kind === 'blocker' ? LANE_X.L : LANE_X.R,
    hp: type.hp, alive: true, ousted: false, state: kind === 'blocker' ? 'enter' : 'walk',
    st: 0, next: 1, recT: 0, stagT: 0.7, shakeT: 0, speed: rand(2.3, 3.0),
    mesh: makePerson(type.color, pick(HAIRS), type.w, type.acc)
  };
  f.mesh.position.set(f.x, footY('R', y), -y * D);
  S.foes.push(f);
  return f;
}
function spawnBlocker(y, type) {
  if (S.foes.some(f => f.alive && Math.abs(f.y - y) < 3.5)) y += 4;
  let idx = -1, bd = 2.5;
  S.standers.forEach((s, i) => { const d = Math.abs(s.y - y); if (d < bd) { bd = d; idx = i; } });
  if (idx >= 0) y = S.standers[idx].y;
  if (y > CFG.STEPS - 4 || y < 1) return;
  if (idx >= 0) { scene.remove(S.standers[idx].mesh); S.standers.splice(idx, 1); }
  const f = addFoe('blocker', y, type);
  pop(f.mesh.position, '仁王立ち！', '#ff9f43', 1.1, 16);
}
function setIdle(f) { f.state = 'idle'; f.st = 0; f.next = rand(...f.type.idle); }
function facingFoe() {
  const p = S.player;
  let best = null, bg = 1e9;
  for (const f of S.foes) {
    if (!f.alive || f.state === 'enter') continue;
    const g = f.dir * (f.y - p.y);
    if (g > -0.01 && g < bg) { bg = g; best = f; }
  }
  return best;
}
function playerActive() {
  const p = S.player;
  return !S.demo && p.lane === 'R' && p.state !== 'thrown' && p.state !== 'vault';
}
function contactFoe() {
  if (!playerActive()) return null;
  const f = facingFoe();
  return f && f.dir * (f.y - S.player.y) <= CFG.CONTACT ? f : null;
}
function foeAhead(y) {
  let best = null;
  for (const f of S.foes) {
    if (f.alive && f.state !== 'enter' && f.dir === 1 && f.y > y && (!best || f.y < best.y)) best = f;
  }
  return best;
}
const powerLv = () => S.mode === 'stand' ? Math.floor(S.t / CFG.POWER_UP_SEC) : 0;
function hitFoe(f) {
  const weak = f.state === 'recover' || f.state === 'stagger';
  f.hp -= CFG.PUNCH_DMG * (weak ? CFG.WEAK_MULT : 1);
  f.shakeT = 0.2;
  pop(f.mesh.position, weak ? 'ドゴッ!!' : 'ボコッ', weak ? '#ffd84d' : '#fff');
  S.shake = weak ? 6 : 3;
  sfx(weak ? 160 : 220, 0.08, 'square', 0.06, -60);
  if (f.hp <= 0) oust(f);
}
function oust(f) {
  f.alive = false; f.ousted = true;
  S.bodies.push({ mesh: f.mesh, x0: f.x, y0: f.y, x1: rand(1.4, 2.3), y1: Math.max(0.5, f.y - rand(2, 5)), h0: f.mesh.position.y, t: 0, dur: 0.6, life: 2.2 });
  if (f.kind === 'blocker') { S.stats.oust++; pop(f.mesh.position, 'どかした！', '#ffd84d', 1.2, 22); }
  else { S.stats.block++; pop(f.mesh.position, '妨害成功！', '#ffd84d', 1.2, 22); }
  sfx(90, 0.3, 'sawtooth', 0.06, -40);
}
function hurtPlayer(f) {
  const p = S.player;
  const dmg = (f.type.dmg || 1) + powerLv() * CFG.POWER_UP_DMG;
  if (p.guard) {
    if (p.guardT <= CFG.JUST_GUARD) {
      f.state = 'stagger'; f.stagT = CFG.JUST_STAGGER; f.st = 0;
      S.stats.jg++;
      pop(p.mesh.position, 'ジャストガード！', '#7CFC9A', 1.0, 22);
      sfx(1200, 0.12, 'triangle', 0.06, 400);
      return;
    }
    const chip = S.mode === 'stand' ? Math.floor(dmg * CFG.GUARD_CHIP) : 0;
    pop(p.mesh.position, chip ? `ガード！ -${chip}` : 'ガード！', '#9fd3ff', 0.8, 18);
    sfx(500, 0.08, 'triangle', 0.05);
    if (chip) { p.hp -= chip; if (p.hp <= 0) throwPlayer(0.8); }
    return;
  }
  if (S.mode === 'walk') { throwPlayer(f.type.drop || 1); return; }
  p.hp -= dmg;
  S.shake = 10;
  pop(p.mesh.position, `ドンッ！ -${dmg}`, '#ff6b6b', 0.8, 20);
  sfx(160, 0.12, 'square', 0.06, -60);
  if (p.hp <= 0) throwPlayer(0.8);
}
// 階段へ投げ飛ばされ → 転げ落ちる → 起き上がる
function throwPlayer(mul) {
  const p = S.player;
  const drop = rand(CFG.THROW_DROP[0], CFG.THROW_DROP[1]) * mul;
  p.state = 'thrown'; p.st = 0; p.guard = false;
  p.fx = p.x; p.tx = LANE_X.S;
  p.fy = p.y; p.my = Math.max(0, p.y - 2); p.ty = Math.max(0, p.y - drop);
  p.h0 = p.h; p.roll = 0;
  p.tumbleT = Math.max(0.3, (p.my - p.ty) / CFG.TUMBLE_SPEED);
  p.rollTotal = Math.max(1, Math.round((p.my - p.ty) * 0.8 / (Math.PI * 2))) * Math.PI * 2;
  S.stats.thrown++;
  pop(p.mesh.position, S.mode === 'stand' ? '投げ飛ばされた！' : '階段へポイッ！', '#ff6b6b', 1.3, 24);
  S.shake = 14;
  sfx(400, 0.45, 'sawtooth', 0.06, -320);
}
function updateFoes(dt) {
  const E = CFG.ESC_SPEED, p = S.player;
  for (const f of S.foes) {
    if (!f.alive) continue;
    f.st += dt; f.shakeT -= dt;
    if (f.state === 'enter') {
      f.y += E * dt;
      const k = Math.min(1, f.st / 0.45);
      f.x = lerp(LANE_X.L, LANE_X.R, easeOut(k));
      if (k >= 1) setIdle(f);
      continue;
    }
    const engaged = playerActive() && facingFoe() === f && f.dir * (f.y - p.y) < 3;
    const gap = engaged ? f.dir * (f.y - p.y) : 99;
    if (f.kind === 'walker') {
      let ny = f.y + (E + f.speed) * dt;
      if (playerActive() && p.y > f.y) ny = Math.min(ny, p.y - 1);
      for (const o of S.foes) if (o !== f && o.alive && o.y > f.y) ny = Math.min(ny, o.y - CFG.WALKER_GAP);
      f.y = Math.max(f.y, ny);
      if (f.state === 'walk') { if (engaged && gap <= 1.05) setIdle(f); continue; }
      if (!engaged) { f.state = 'walk'; continue; }
    } else {
      f.y += E * dt;
    }
    if (f.state === 'idle') {
      if (gap <= CFG.CONTACT + 0.25) {
        if (f.st >= f.next) { f.state = 'windup'; f.st = 0; sfx(880, 0.08, 'square', 0.04); }
      } else {
        f.st = Math.min(f.st, f.next * 0.5);
      }
    } else if (f.state === 'windup') {
      if (f.st >= f.type.windup) {
        f.st = 0;
        if (gap <= CFG.GRAB_RANGE) { f.state = 'recover'; f.recT = 0.6; hurtPlayer(f); }
        else { f.state = 'recover'; f.recT = 1.0; pop(f.mesh.position, 'スカッ → スキ！', '#7CFC9A', 1, 18); }
      }
    } else if (f.state === 'recover') {
      if (f.st >= f.recT) setIdle(f);
    } else if (f.state === 'stagger') {
      if (f.st >= f.stagT) setIdle(f);
    }
  }
  for (const f of S.foes) {
    if (f.alive && (f.y >= CFG.STEPS - 0.3 || f.y < p.y - 25)) f.alive = false;
  }
  S.foes = S.foes.filter(f => {
    if (!f.alive && !f.ousted) scene.remove(f.mesh);
    return f.alive;
  });
}
function spawns(dt) {
  if (S.mode === 'walk') {
    while (S.spawnIdx < S.spawnPts.length && S.player.y >= S.spawnPts[S.spawnIdx]) {
      const lastOne = S.spawnIdx === S.spawnPts.length - 1;
      spawnBlocker(Math.max(0, S.player.y) + rand(6, 9), lastOne ? HEAVY : null);
      S.spawnIdx++;
    }
    return;
  }
  S.wT -= dt;
  if (S.wT <= 0) {
    S.wT = rand(...CFG.WALKER_INTERVAL) * Math.max(CFG.WALKER_INTERVAL_MIN, 1 - S.t / 400);
    const y = Math.max(0, S.player.y - 9);
    const nearPlayer = playerActive() && Math.abs(S.player.y - y) < CFG.WALKER_GAP;
    if (!nearPlayer && !S.foes.some(f => Math.abs(f.y - y) < CFG.WALKER_GAP + 1)) addFoe('walker', y);
  }
}

// ===== プレイヤー =====
function attack() {
  if (!S || S.demo || S.phase !== 'run') return;
  const p = S.player;
  if (p.state !== 'normal' || p.lane !== 'R' || p.guard || p.punchCd > 0) return;
  p.punchCd = CFG.PUNCH_CD; p.armT = 0.15; S.stats.punch++;
  const f = contactFoe();
  if (f) hitFoe(f); else sfx(300, 0.05, 'triangle', 0.03);
}
function laneMove(d) {
  if (!S || S.demo || S.phase !== 'run' || S.mode !== 'walk') return;
  const p = S.player, order = ['L', 'R', 'S'];
  if (p.state !== 'normal') return;
  const target = order[order.indexOf(p.lane) + d];
  if (!target) return;
  if (target === 'L') { pop(p.mesh.position, '左は立ち止まる人の列', '#ccc', 0.9, 15); return; }
  if (target === 'R' && S.foes.some(f => f.alive && Math.abs(f.y - p.y) < 1.5)) { pop(p.mesh.position, '着地できない！', '#ff6b6b'); return; }
  p.state = 'vault'; p.st = 0; p.guard = false;
  p.fx = p.x; p.tx = LANE_X[target]; p.h0 = p.h; p.toLane = target;
  p.climbDir = Math.sign(p.tx - p.fx);
  p.vt = CFG.CLIMB_TIME;
  pop(p.mesh.position, 'よいしょっ！', '#fff', 0.8, 15);
  sfx(500, 0.08, 'triangle', 0.04, 300);
}
function updatePlayer(dt) {
  const p = S.player, E = CFG.ESC_SPEED;
  p.punchCd -= dt; p.armT -= dt;
  p.walking = false;
  if (p.state === 'thrown') {
    p.st += dt;
    if (p.st < CFG.THROW_FLY) {
      const k = p.st / CFG.THROW_FLY;
      p.x = lerp(p.fx, p.tx, easeOut(k));
      p.y = lerp(p.fy, p.my, k);
      p.h = lerp(p.h0, footY('S', p.my), k) + Math.sin(Math.PI * k) * 1.3;
      return;
    }
    const k = Math.min(1, (p.st - CFG.THROW_FLY) / p.tumbleT);
    p.x = p.tx;
    p.y = lerp(p.my, p.ty, k);
    p.h = footY('S', p.y) + Math.abs(Math.sin(p.y * 1.4)) * 0.18;
    p.roll = k * p.rollTotal;
    if (k >= 1) {
      p.lane = 'S'; p.state = 'stun'; p.st = 0; p.roll = 0; p.h = footY('S', p.y);
      sfx(80, 0.2, 'square', 0.06, -30);
      if (S.mode === 'stand') { finish(true); return; }
      p.hp = CFG.PLAYER_HP;
    }
    return;
  }
  if (p.state === 'vault') {
    p.st += dt;
    const k = Math.min(1, p.st / p.vt);
    const s = clamp((k - 0.2) / 0.62, 0, 1), xs = s * s * (3 - 2 * s);
    p.x = lerp(p.fx, p.tx, xs);
    const hump = (k > 0.2 && k < 0.9) ? Math.sin(Math.PI * (k - 0.2) / 0.7) * 1.15 : 0;
    p.h = lerp(p.h0, footY(p.toLane, p.y), xs) + hump;
    if (k >= 1) {
      p.lane = p.toLane; p.state = 'normal';
      sfx(120, 0.12, 'square', 0.05, -40);
    }
    return;
  }
  if (p.state === 'stun') {
    p.st += dt;
    p.h = footY(p.lane, p.y);
    if (p.st >= CFG.STUN) p.state = 'normal';
    return;
  }
  const wasGuard = p.guard;
  p.guard = !S.demo && input.guard && p.lane !== 'S';
  p.guardT = p.guard ? (wasGuard ? p.guardT + dt : 0) : 0;
  let v = p.lane === 'S' ? 0 : E;
  if (!p.guard && !S.demo) {
    if (input.up) { v += CFG.WALK_SPEED; p.walking = true; }
    else if (input.down) { v -= (S.mode === 'stand' ? CFG.STAND_DOWN_SPEED : CFG.BACK_SPEED); p.walking = true; }
  }
  const prevY = p.y;
  p.y += v * dt;
  if (p.lane === 'R' && !S.demo) {
    if (S.mode === 'walk') {
      const f = foeAhead(prevY);
      if (f && p.y > f.y - 1) p.y = f.y - 1;
    } else {
      for (const f of S.foes) {
        if (!f.alive || f.state === 'enter') continue;
        if (f.y < prevY) p.y = Math.max(p.y, f.y + 1);
        else p.y = Math.min(p.y, f.y - 1);
      }
    }
  }
  p.y = Math.max(0, p.y);
  p.h = footY(p.lane, p.y);
  if (p.y >= CFG.STEPS && v > 0) { S.t -= (p.y - CFG.STEPS) / v; finish(false); }
}
function finish(over) {
  if (S.demo) { startDemo(); return; }
  if (S.phase !== 'run') return;
  S.phase = 'finish'; S.finishT = 0; S.final = S.t; S.over = over;
  if (over) {
    sfx(220, 0.6, 'sawtooth', 0.05, -160);
  } else {
    sfx(784, 0.12, 'square', 0.05);
    setTimeout(() => sfx(988, 0.12, 'square', 0.05), 130);
    setTimeout(() => sfx(1318, 0.3, 'square', 0.05), 260);
  }
}

// ===== 更新 =====
function updateStanders(dt) {
  for (const s of S.standers) s.y += CFG.ESC_SPEED * dt;
  S.standers = S.standers.filter(s => {
    if (s.y < CFG.STEPS + 0.3) return true;
    scene.remove(s.mesh);
    return false;
  });
  const lowest = S.standers.reduce((m, s) => Math.min(m, s.y), 999);
  const yNew = ((S.esc % 1) + 0.5) % 1;
  if (lowest - yNew >= S.nextBoard - 0.01) {
    addStander(yNew);
    S.nextBoard = 1 + Math.floor(rand(1, 3));
  }
}
function updateFx(dt) {
  for (const q of S.pops) q.t += dt;
  S.pops = S.pops.filter(q => q.t < q.life);
  for (const b of S.bodies) { b.t += dt; if (b.t >= b.dur) b.life -= dt; }
  S.bodies = S.bodies.filter(b => {
    if (b.life > 0) return true;
    scene.remove(b.mesh);
    return false;
  });
  S.shake = Math.max(0, S.shake - dt * 40);
}
function step(dt) {
  S.t += dt;
  S.esc += CFG.ESC_SPEED * dt;
  updateStanders(dt);
  updatePlayer(dt);
  if (S.phase !== 'run') return;
  updateFoes(dt);
  spawns(dt);
  updateFx(dt);
}
function finishTick(dt) {
  const p = S.player;
  S.finishT += dt;
  S.esc += CFG.ESC_SPEED * dt;
  updateStanders(dt);
  if (!S.over) {
    const stopY = CFG.STEPS + 12;
    p.walking = p.y < stopY;
    if (p.walking) p.y = Math.min(stopY, p.y + 2.4 * dt);
    p.h = footY(p.lane, p.y);
  }
  updateFx(dt);
  if (!S.shown) {
    fadeEl.style.opacity = String(clamp((S.finishT - 0.3) / 0.8, 0, 1));
    if (S.finishT > 1.2) showResult();
  }
}
function place(m, x, ys, h, rotY, smooth) {
  m.position.x = x;
  m.position.z = -ys * D;
  m.position.y = smooth ? lerp(m.position.y, h, 0.4) : h;
  m.rotation.y = rotY;
}
function syncMeshes() {
  const p = S.player;
  for (const s of S.standers) {
    const vis = Math.abs(s.y - p.y) < 90;
    s.mesh.visible = vis;
    if (!vis) continue;
    place(s.mesh, LANE_X.L, s.y, footY('L', s.y), 0, false);
    pose(s.mesh, { phone: s.phone });
  }
  for (const f of S.foes) {
    const faceBack = f.kind === 'blocker' && (f.state === 'windup' || f.state === 'recover');
    place(f.mesh, f.x + (f.shakeT > 0 ? rand(-0.03, 0.03) : 0), f.y, footY('R', f.y), faceBack ? Math.PI : 0, true);
    pose(f.mesh, {
      walk: f.state === 'walk' ? S.t * 10 : null, akimbo: f.kind === 'blocker' && f.state !== 'windup',
      reach: f.state === 'windup', stagger: f.state === 'stagger'
    });
  }
  for (const b of S.bodies) {
    const k = Math.min(1, b.t / b.dur), y = lerp(b.y0, b.y1, k);
    b.mesh.position.set(lerp(b.x0, b.x1, easeOut(k)), lerp(b.h0, footY('S', b.y1), k) + Math.sin(Math.PI * k) * 1.2 + (k >= 1 ? 0.25 : 0), -y * D);
    pose(b.mesh, {});
    if (k < 1) b.mesh.rotation.z = k * Math.PI * 3; else b.mesh.rotation.x = Math.PI / 2;
  }
  const faceTarget = (S.mode === 'stand' && S.phase !== 'finish') ? Math.PI : 0;
  p.face = lerp(p.face, faceTarget, 0.25);
  place(p.mesh, p.x, p.y, p.h, p.face, p.state === 'normal' || p.state === 'stun');
  pose(p.mesh, {
    walk: p.walking ? S.t * 12 : null, punch: p.armT > 0, guard: p.guard && p.armT <= 0,
    akimbo: S.mode === 'stand' && p.lane === 'R' && p.armT <= 0 && !p.guard && !p.walking
  });
  const m = p.mesh;
  if (p.state === 'thrown') {
    const k = Math.min(1, p.st / CFG.THROW_FLY);
    m.rotation.set(p.roll, 0, -k * Math.PI * 2.5);
    m.position.x = p.x - 0.85 * k;
    m.position.y += 0.3 * k;
  } else if (p.state === 'stun' && p.lane === 'S') {
    const k = 1 - clamp((p.st - CFG.STUN * 0.5) / (CFG.STUN * 0.5), 0, 1);
    m.rotation.set(0, 0, -k * Math.PI / 2);
    m.position.x = p.x - 0.85 * k;
    m.position.y = p.h + 0.3 * k;
  } else if (p.state === 'vault') {
    climbPose(p);
  }
}
function updateCamera(dt) {
  const p = S.player;
  const back = S.mode === 'stand' && !S.demo && p.lane === 'R' && p.state === 'normal' && S.phase !== 'finish';
  const down = p.state === 'thrown' || (p.state === 'stun' && p.lane === 'S');
  let tp, tl;
  if (back) {
    tp = wpc(p.x + 0.55, p.y + 3.2, 2.3); tl = wpc(p.x, p.y - 5, 0.4);
  } else if (down) {
    if (S.mode === 'stand') { tp = wpc(1.0, p.y + 5, 3.0); tl = wpc(1.5, p.y - 2, 0.3); }
    else { tp = wpc(1.1, p.y - 6.5, 3.0); tl = wpc(1.5, p.y + 1, 0.3); }

  const k = S.snap ? 1 : 1 - Math.exp(-dt * (down ? 9 : 5));
  S.snap = false;

  camera.position.copy(camPos);
  if (S.shake > 0) camera.position.add(new THREE.Vector3(rand(-1, 1), rand(-1, 1), 0).multiplyScalar(S.shake * 0.004));

// ===== ユーザー名・ランキング =====
const sbUrl = () => String(RANKING.SUPABASE_URL || '').trim().replace(/\/+$/, '').replace(/\/rest\/v1$/, '');
const sbKey = () => String(RANKING.SUPABASE_KEY || '').trim();
// 公開してはいけない種類のキー（secret / service_role）が貼られていないか
function secretKeyPasted() {
  const k = sbKey();
  if (k.startsWith('sb_secret_')) return true;
  if (k.startsWith('eyJ')) {
    try {
      return JSON.parse(atob(k.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).role === 'service_role';
    } catch (e) {}
  }
  return false;
}
const isOnline = () => !!(sbUrl() && sbKey()) && !secretKeyPasted();
let TOKEN = null;
// この端末の合言葉（名前の持ち主の確認に使う。端末内に保存）
function token() {
  if (TOKEN) return TOKEN;
  let t = store.get('escfight_token');
  if (!t || t.length < 16) {
    try {
      t = crypto.randomUUID ? crypto.randomUUID()
        : Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
    } catch (e) {
      t = Array.from({ length: 32 }, () => Math.floor(Math.random() * 16).toString(16)).join('');
    }
    store.set('escfight_token', t);
  }
  return (TOKEN = t);
}
// Supabase の関数を呼ぶ（8秒で打ち切り）
async function rpc(fn, args) {
  const K = sbKey(), H = { apikey: K, 'Content-Type': 'application/json' };
  if (K.startsWith('eyJ')) H.Authorization = 'Bearer ' + K;
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 8000);
  try {
    const r = await fetch(`${sbUrl()}/rest/v1/rpc/${fn}`, { method: 'POST', headers: H, body: JSON.stringify(args), signal: ctrl.signal });
    if (!r.ok) throw new Error(`${fn} ${r.status}`);
    return await r.json();
  } finally {
    clearTimeout(timer);
  }
}
const Names = {
  owned: null,
  // 名前の登録・確認。他の端末が登録済みなら { ok: false, error: 'name_taken' }
  async claim(name) {
    if (!isOnline() || this.owned === nameKey(name)) return { ok: true, name };
    const r = await rpc('claim_name', { p_name: name, p_token: token() });
    if (!r || !r.ok) return { ok: false, error: (r && r.error) || 'error' };
    this.owned = nameKey(r.name || name);
    return { ok: true, name: r.name || name };
  }
};
const Rank = {
  cmp(mode) {
    return mode === 'walk'
      ? (a, b) => (a.sec - b.sec) || (a.at - b.at)
      : (a, b) => (b.blocks - a.blocks) || (a.sec - b.sec) || (a.at - b.at);
  },
  // オンラインにつながらないときは、端末内ランキングに切り替える
  async run(e) {
    if (!isOnline()) return this.local(e);
    try {
      return await this.online(e);
    } catch (err) {
      if (err && err.serverError) throw err;
      const r = this.local(e);
      r.fallback = true;
      return r;
    }
  },
  // 端末内ランキング（1人1記録＝自己ベスト）
  local(e) {
    const key = 'escfight2_best_' + e.mode, cmp = this.cmp(e.mode);
    let list = [];
    try { list = JSON.parse(store.get(key) || '[]'); } catch (_) {}
    if (!Array.isArray(list)) list = [];
    const rec = { key: nameKey(e.name), name: e.name, sec: e.sec, blocks: e.blocks, at: Date.now() };
    let mine = list.find(r => r.key === rec.key);
    if (!mine) { mine = rec; list.push(rec); }
    else if (cmp(rec, mine) < 0) Object.assign(mine, rec);
    list.sort(cmp);
    store.set(key, JSON.stringify(list));
    const idx = list.indexOf(mine);
    return {
      local: true, name: mine.name, total: list.length,
      best: mine.sec === e.sec && mine.blocks === e.blocks,
      me: { rank: idx + 1, sec: mine.sec, blocks: mine.blocks },
      top: list.slice(0, 50).map((r, i) => ({ rank: i + 1, name: r.name, sec: r.sec, blocks: r.blocks, me: r === mine }))
    };
  },
  async online(e) {
    const r = await rpc('submit_score', { p_name: e.name, p_token: token(), p_mode: e.mode, p_sec: e.sec, p_blocks: e.blocks });
    if (!r || !r.ok) {
      const err = new Error('submit_score');
      err.serverError = (r && r.error) || 'error';
      throw err;
    }
    return r;
  }
};

// ===== 入力 =====
const kb = { up: false, down: false, guard: false }, joy = { x: 0, y: 0, id: null, latch: 0 };
const input = { up: false, down: false, guard: false };
let btnGuard = false;
function readInput() {
  input.up = kb.up || joy.y < -0.4;
  input.down = kb.down || joy.y > 0.5;
  input.guard = kb.guard || btnGuard;
  if (Math.abs(joy.x) > 0.6 && Math.abs(joy.x) > Math.abs(joy.y) * 0.8) {
    const d = Math.sign(joy.x);
    if (joy.latch !== d) { joy.latch = d; laneMove(d); }
  } else if (Math.abs(joy.x) < 0.3) {
    joy.latch = 0;
  }
}
const joyEl = $('#joy'), knob = $('#knob');
function moveJoy(e) {
  const r = joyEl.getBoundingClientRect();

  const max = r.width * 0.4, d = Math.hypot(dx, dy);
  if (d > max) { dx *= max / d; dy *= max / d; }

// ===== 画面サイズ・ループ =====
function resize() {

let last = performance.now();

    else if (c !== S.lastCount) { S.lastCount = c; sfx(523, 0.12, 'square', 0.05); }
    updateFx(raw);
  } else if (S.phase === 'run') {
    step(raw);
  } else if (S.phase === 'finish') {
    finishTick(raw);
  }
  syncMeshes();
  updateSteps();
  updateCamera(raw);
  renderer.render(scene, camera);
  drawHUD();
  requestAnimationFrame(loop);
}

buildWorld();
resize();
showTitle();
if (secretKeyPasted()) {
  $('#title .inner').insertAdjacentHTML('afterbegin', '<p class="err">設定エラー：secret key（秘密のキー）が貼り付けられています。publishable key に差し替え、Supabase でそのキーを無効化してください。</p>');
}
window.__ok = true;
$('#loading').remove();
requestAnimationFrame(loop);
</script>
</body>
</html>
